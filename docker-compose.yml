services:
  postgres:
    image: postgres:16-alpine
    container_name: memebot-postgres
    environment:
      POSTGRES_USER: memebot
      POSTGRES_PASSWORD: memebot
      POSTGRES_DB: memebot
    ports:
      - "5432:5432"
    volumes:
      - memebot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memebot -d memebot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memebot_pgdata:
